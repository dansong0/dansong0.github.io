title: Simian Spirit Guide
subtitle: de te fabula narratur.
email: dansong01@gmail.com
description: we are initiated, are we not?
baseurl: ""
url: "https://dansong0.github.io"
repository: dansong0/dansong0.github.io

# Minimal Mistakes theme
remote_theme: mmistakes/minimal-mistakes
minimal_mistakes_skin: "default"

plugins:
  - jekyll-remote-theme
  - jekyll-feed
  - jekyll-include-cache

# Defaults for posts
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: false
      read_time: false
      comments: false
      share: false
      related: false

# Author info (optional)
author:
  name: Dan
  email: dansong01@gmail.com

# Social
social:
  type: Person
  links:
    - https://www.instagram.com/dansong0

# Pagination (optional, enables home page post list)
paginate: 5
